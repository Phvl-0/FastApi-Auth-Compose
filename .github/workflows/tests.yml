name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Run the tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-only-throwaway-password@localhost:5432/postgres
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          .venv/bin/python -m pytest -v
